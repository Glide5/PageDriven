<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="640" height="640"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes; uniform int uIcon;
mat3 rX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}
mat3 rY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}
mat3 rZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.,-s,c,0.,0.,0.,1.);}
float sdS(vec3 p,float r){return length(p)-r;}
float sdB(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
float sdT(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdC(vec3 p,float ra,float h,float rb){vec2 d=vec2(length(p.xz)-(ra-rb),abs(p.y)-(h-rb));return min(max(d.x,d.y),0.)+length(max(d,0.))-rb;}
float sdK(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdE(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdRC(vec3 p,float r1,float r2,float h){vec2 q=vec2(length(p.xz),p.y);float b=(r1-r2)/h;float a=sqrt(1.0-b*b);float k=dot(q,vec2(-b,a));if(k<0.0)return length(q)-r1;if(k>a*h)return length(q-vec2(0.0,h))-r2;return dot(q,vec2(a,b))-r1;}
vec2 U(vec2 a,vec2 b){return a.x<b.x?a:b;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec2 bust(vec3 q,float shirt,float skin,float hair,int style){
  vec2 r=vec2(1e5,0.);
  float shoulders=sdE(q-vec3(0.,-0.8,0.),vec3(0.88,0.42,0.45));
  float body=sdB(q-vec3(0.,-2.05,0.),vec3(0.76,1.2,0.42),0.3);
  r=U(r,vec2(smin(shoulders,body,0.35),shirt));
  r=U(r,vec2(sdT(q-vec3(0.,-0.4,0.04),vec2(0.19,0.045)),shirt+0.3));
  r=U(r,vec2(sdC(q-vec3(0.,-0.12,0.),0.18,0.22,0.06),skin));
  r=U(r,vec2(sdE(q-vec3(0.,0.42,0.02),vec3(0.4,0.5,0.43)),skin));
  r=U(r,vec2(sdE(q-vec3(0.4,0.38,-0.02),vec3(0.06,0.11,0.07)),skin));
  r=U(r,vec2(sdE(q-vec3(-0.4,0.38,-0.02),vec3(0.06,0.11,0.07)),skin));
  float hairE=sdE(q-vec3(0.,0.5,-0.05),vec3(0.435,0.47,0.475)), hd;
  if(style==0){ float cut=0.64-0.12*q.x-0.32*max(0.,-q.z); hd=smin(max(hairE,cut-q.y),sdE(rZ(-0.15)*(q-vec3(0.05,0.84,0.12)),vec3(0.27,0.1,0.22)),0.1); }
  else if(style==1){ float shell=sdE(q-vec3(0.,0.42,-0.04),vec3(0.5,0.6,0.52)); hd=max(max(shell,-max(0.1-q.z,q.y-0.62)),-0.02-q.y); }
  else { float cut=0.68-0.3*max(0.,-q.z); hd=smin(max(hairE,cut-q.y),sdS(q-vec3(0.,0.9,-0.3),0.2),0.08); }
  r=U(r,vec2(hd,hair));
  return r;
}
/* materials: 1 violet 2 lilac 3 pearl 4 cyan 5 pink 6 peach 7 navy 8 amber 9 glass */
vec2 scene(vec3 p){
  vec2 r=vec2(1e5,0.);
  if(uIcon==0){ /* round peg, square hole: message mismatch */
    vec3 q=rY(0.55)*(p-vec3(0.,-0.42,0.));
    float slab=sdB(q,vec3(0.95,0.16,0.95),0.14);
    float hole=sdB(q,vec3(0.34,0.5,0.34),0.06);
    r=U(r,vec2(max(slab,-hole),3.));
    r=U(r,vec2(sdS(p-vec3(0.5,0.42,0.52),0.3),1.));
  } else if(uIcon==1){ /* pill CTA hovering over a page: looks fine, no click */
    vec3 q=rY(0.5)*(p-vec3(0.,-0.5,0.));
    r=U(r,vec2(sdB(q,vec3(0.95,0.07,0.75),0.06),3.));
    vec3 k=rY(0.5)*(p-vec3(-0.05,-0.1,-0.05));
    r=U(r,vec2(sdK(k,vec3(-0.42,0.,0.),vec3(0.42,0.,0.),0.24),1.));
    r=U(r,vec2(sdS(p-vec3(0.55,0.45,0.6),0.12),6.));
  } else if(uIcon==2){ /* stacked platform slabs */
    r=U(r,vec2(sdB(rY(0.55)*(p-vec3(0.,-0.62,0.)),vec3(0.92,0.12,0.92),0.1),4.));
    r=U(r,vec2(sdB(rY(0.85)*(p-vec3(0.,-0.27,0.)),vec3(0.72,0.12,0.72),0.1),2.));
    r=U(r,vec2(sdB(rY(1.15)*(p-vec3(0.,0.08,0.)),vec3(0.52,0.12,0.52),0.1),3.));
    r=U(r,vec2(sdS(p-vec3(0.12,0.5,0.05),0.24),1.));
  } else if(uIcon==3){ /* coin stacks rising: growing spend */
    for(int s=0;s<3;s++){
      float fs=float(s); vec3 base=vec3(-0.62+fs*0.62,-0.72,0.28-fs*0.28);
      for(int c=0;c<7;c++){ float fc=float(c); if(fc>1.+fs*2.5) break;
        float d=sdC(p-base-vec3(0.,fc*0.15,0.),0.3,0.065,0.035);
        r=U(r,vec2(d,mod(fc,2.)<0.5?8.:6.)); }
    }
  } else if(uIcon==4){ /* target with one sphere: one clear action */
    vec3 q=rX(-0.18)*(p-vec3(0.,-0.35,0.));
    r=U(r,vec2(sdC(q,0.98,0.09,0.06),3.));
    r=U(r,vec2(sdT(q-vec3(0.,0.12,0.),vec2(0.66,0.065)),2.));
    r=U(r,vec2(sdT(q-vec3(0.,0.12,0.),vec2(0.36,0.065)),1.));
    r=U(r,vec2(sdS(q-vec3(0.,0.34,0.),0.2),6.));
  } else if(uIcon==5){ /* modular page blocks: website structure */
    vec3 q=rY(0.6)*(p-vec3(0.,-0.6,0.));
    r=U(r,vec2(sdB(q,vec3(0.98,0.06,0.98),0.05),3.));
    float h0=0.24,h1=0.5,h2=0.36,h3=0.62;
    r=U(r,vec2(sdB(q-vec3(-0.46,h0,-0.46),vec3(0.38,h0,0.38),0.08),2.));
    r=U(r,vec2(sdB(q-vec3(0.46,h1,-0.46),vec3(0.38,h1,0.38),0.08),1.));
    r=U(r,vec2(sdB(q-vec3(-0.46,h2,0.46),vec3(0.38,h2,0.38),0.08),4.));
    r=U(r,vec2(sdB(q-vec3(0.46,h3*0.5,0.46),vec3(0.38,h3*0.5,0.38),0.08),3.));
  } else if(uIcon==6){ /* magnifier: audit */
    mat3 m=rY(-0.7)*rX(0.25);
    vec3 q=m*(p-vec3(-0.15,0.12,0.));
    vec3 qt=vec3(q.x,q.z,q.y);
    r=U(r,vec2(sdT(qt,vec2(0.5,0.11)),1.));
    r=U(r,vec2(sdE(q,vec3(0.42,0.42,0.07)),9.));
    r=U(r,vec2(sdK(q,vec3(0.42,-0.42,0.),vec3(0.86,-0.86,0.),0.12),7.));
  } else if(uIcon==7){ /* interlocked rings: ongoing partnership */
    mat3 m=rY(0.5)*rZ(0.35);
    vec3 q=m*p;
    r=U(r,vec2(sdT(q-vec3(-0.3,0.,0.),vec2(0.46,0.12)),1.));
    vec3 q2=q-vec3(0.3,0.,0.); q2=vec3(q2.x,q2.z,q2.y);
    r=U(r,vec2(sdT(q2,vec2(0.46,0.12)),4.));
  } else if(uIcon==8){ /* booking card: service business */
    mat3 m=rY(-0.32);
    vec3 q=m*(p-vec3(0.,0.,0.));
    r=U(r,vec2(sdB(q,vec3(0.62,0.82,0.07),0.12),3.));
    r=U(r,vec2(sdK(q-vec3(0.,-0.45,0.1),vec3(-0.3,0.,0.),vec3(0.3,0.,0.),0.12),1.));
    r=U(r,vec2(sdB(q-vec3(-0.12,0.42,0.09),vec3(0.36,0.05,0.03),0.03),2.));
    r=U(r,vec2(sdB(q-vec3(-0.22,0.24,0.09),vec3(0.26,0.04,0.03),0.03),2.));
    r=U(r,vec2(sdS(q-vec3(0.5,0.72,0.35),0.17),6.));
  } else if(uIcon==9){ /* layered panels: white-label for agencies */
    mat3 m=rY(-0.32);
    vec3 q=m*p;
    r=U(r,vec2(sdB(q-vec3(0.34,0.3,-0.5),vec3(0.52,0.66,0.06),0.1),4.));
    r=U(r,vec2(sdB(q-vec3(0.08,0.05,-0.12),vec3(0.52,0.66,0.06),0.1),2.));
    r=U(r,vec2(sdB(q-vec3(-0.18,-0.2,0.26),vec3(0.52,0.66,0.06),0.1),3.));
    r=U(r,vec2(sdK(q-vec3(-0.18,-0.58,0.36),vec3(-0.22,0.,0.),vec3(0.22,0.,0.),0.1),1.));

  } else if(uIcon==10){ /* clipboard brief */
    mat3 m=rY(-0.5)*rX(-0.15); vec3 q=m*p;
    r=U(r,vec2(sdB(q,vec3(0.62,0.82,0.06),0.08),3.));
    r=U(r,vec2(sdB(q-vec3(0.,0.82,0.06),vec3(0.26,0.1,0.08),0.05),1.));
    for(int k=0;k<3;k++){ float y=0.38-float(k)*0.3;
      r=U(r,vec2(sdB(q-vec3(0.06,y,0.07),vec3(0.34-float(k)*0.06,0.035,0.02),0.02),2.));
      r=U(r,vec2(sdS(q-vec3(-0.4,y,0.1),0.065),k==0?6.:4.)); }
    r=U(r,vec2(sdB(q-vec3(0.,-0.5,0.08),vec3(0.36,0.09,0.03),0.07),1.));
  } else if(uIcon==11){ /* page wireframe in relief */
    vec3 q=rY(0.6)*(p-vec3(0.,-0.45,0.));
    r=U(r,vec2(sdB(q,vec3(0.95,0.06,0.78),0.05),3.));
    r=U(r,vec2(sdB(q-vec3(0.,0.1,-0.6),vec3(0.82,0.05,0.09),0.04),1.));
    r=U(r,vec2(sdB(q-vec3(-0.38,0.16,-0.15),vec3(0.38,0.12,0.26),0.06),2.));
    for(int k=0;k<3;k++){ r=U(r,vec2(sdB(q-vec3(0.42,0.09,-0.32+float(k)*0.14),vec3(0.34-float(k)*0.06,0.035,0.035),0.03),4.)); }
    r=U(r,vec2(sdK(q-vec3(0.2,0.14,0.4),vec3(-0.26,0.,0.),vec3(0.26,0.,0.),0.09),1.));
    r=U(r,vec2(sdS(q-vec3(-0.55,0.18,0.42),0.12),6.));
  } else if(uIcon==12){ /* pencil over a page */
    vec3 pg=rY(0.55)*(p-vec3(0.,-0.62,0.));
    r=U(r,vec2(sdB(pg,vec3(0.85,0.05,0.7),0.05),3.));
    for(int k=0;k<3;k++){ r=U(r,vec2(sdB(pg-vec3(-0.1,0.07,-0.35+float(k)*0.22),vec3(0.55-float(k)*0.12,0.025,0.035),0.02),2.)); }
    vec3 q=rY(0.5)*rZ(0.95)*(p-vec3(0.05,0.12,0.15));
    r=U(r,vec2(sdC(q-vec3(0.,0.15,0.),0.13,0.56,0.02),8.));
    r=U(r,vec2(sdC(q-vec3(0.,0.76,0.),0.135,0.07,0.02),3.));
    r=U(r,vec2(sdC(q-vec3(0.,0.9,0.),0.13,0.08,0.05),5.));
    r=U(r,vec2(sdRC(vec3(q.x,-q.y-0.41,q.z),0.13,0.02,0.36),6.));
  } else if(uIcon==13){ /* browser window with a passed check */
    mat3 m=rY(-0.32); vec3 q=m*p;
    r=U(r,vec2(sdB(q-vec3(-0.08,0.06,0.),vec3(0.78,0.58,0.06),0.09),3.));
    r=U(r,vec2(sdB(q-vec3(-0.08,0.5,0.07),vec3(0.72,0.06,0.02),0.03),1.));
    r=U(r,vec2(sdB(q-vec3(-0.3,0.15,0.07),vec3(0.4,0.16,0.02),0.03),2.));
    r=U(r,vec2(sdB(q-vec3(-0.38,-0.22,0.07),vec3(0.32,0.035,0.02),0.02),2.));
    r=U(r,vec2(sdB(q-vec3(-0.46,-0.36,0.07),vec3(0.24,0.035,0.02),0.02),2.));
    vec3 qb=q-vec3(0.5,-0.4,0.22);
    r=U(r,vec2(sdC(vec3(qb.x,qb.z,qb.y),0.34,0.07,0.04),4.));
    r=U(r,vec2(sdK(qb-vec3(0.,0.,0.09),vec3(-0.14,0.0,0.),vec3(-0.04,-0.1,0.),0.04),3.));
    r=U(r,vec2(sdK(qb-vec3(0.,0.,0.09),vec3(-0.04,-0.1,0.),vec3(0.15,0.11,0.),0.04),3.));
  } else if(uIcon==14){ /* trophy */
    vec3 q=rY(0.4)*p;
    float outer=sdC(q-vec3(0.,0.38,0.),0.42,0.32,0.06);
    float inner=sdC(q-vec3(0.,0.5,0.),0.35,0.3,0.04);
    r=U(r,vec2(max(outer,-inner),8.));
    vec3 h1=q-vec3(0.44,0.4,0.); r=U(r,vec2(sdT(vec3(h1.x,h1.z,h1.y),vec2(0.17,0.05)),8.));
    vec3 h2=q-vec3(-0.44,0.4,0.); r=U(r,vec2(sdT(vec3(h2.x,h2.z,h2.y),vec2(0.17,0.05)),8.));
    r=U(r,vec2(sdC(q-vec3(0.,-0.08,0.),0.09,0.18,0.03),8.));
    r=U(r,vec2(sdC(q-vec3(0.,-0.33,0.),0.3,0.07,0.04),8.));
    r=U(r,vec2(sdB(q-vec3(0.,-0.5,0.),vec3(0.42,0.1,0.42),0.06),1.));

  } else if(uIcon==15){ /* abstract clay portrait: head and shoulders */
    vec3 q=rY(-0.28)*p;
    float chest=sdE(q-vec3(0.,-1.12,0.),vec3(0.9,0.7,0.5));
    float sh=sdK(q,vec3(-0.6,-0.6,0.),vec3(0.6,-0.6,0.),0.27);
    float torso=max(smin(chest,sh,0.26),-(q.y+1.55));
    r=U(r,vec2(torso,7.));
    r=U(r,vec2(sdT(q-vec3(0.,-0.33,0.03),vec2(0.21,0.05)),2.));
    r=U(r,vec2(sdC(q-vec3(0.,-0.12,0.),0.18,0.22,0.06),10.));
    r=U(r,vec2(sdE(q-vec3(0.,0.42,0.02),vec3(0.4,0.5,0.43)),10.));
    r=U(r,vec2(sdE(q-vec3(0.4,0.38,-0.02),vec3(0.06,0.11,0.07)),10.));
    r=U(r,vec2(sdE(q-vec3(-0.4,0.38,-0.02),vec3(0.06,0.11,0.07)),10.));
    float hairE=sdE(q-vec3(0.,0.5,-0.05),vec3(0.435,0.47,0.475));
    float cut=0.64-0.12*q.x-0.32*max(0.,-q.z);
    float cap=max(hairE,cut-q.y);
    float quiff=sdE(rZ(-0.15)*(q-vec3(0.05,0.84,0.12)),vec3(0.27,0.1,0.22));
    r=U(r,vec2(smin(cap,quiff,0.1),11.));
    for(int k=0;k<2;k++){ float sx=k==0?0.17:-0.17; vec3 d=q-vec3(sx,0.42,0.465);
      r=U(r,vec2(sdT(vec3(d.x,d.z,d.y),vec2(0.1,0.018)),11.)); }
    r=U(r,vec2(sdK(q,vec3(-0.07,0.44,0.47),vec3(0.07,0.44,0.47),0.015),11.));
    r=U(r,vec2(sdK(q,vec3(0.27,0.43,0.44),vec3(0.4,0.43,0.05),0.016),11.));
    r=U(r,vec2(sdK(q,vec3(-0.27,0.43,0.44),vec3(-0.4,0.43,0.05),0.016),11.));
  } else if(uIcon==16){ /* clay team: three specialists side by side */
    r=U(r,bust(rY(-0.38)*(p-vec3(-1.5,-0.12,-0.55)),4.,12.,11.,2));
    r=U(r,bust(rY(0.38)*(p-vec3(1.5,-0.1,-0.55)),5.,13.,14.,1));
    r=U(r,bust(rY(0.1)*(p-vec3(0.,0.02,0.35)),1.,10.,11.,0));
  }
  return r;
}
vec3 matCol(float id){
  if(id<1.5) return vec3(0.36,0.34,0.97);
  if(id<2.5) return vec3(0.74,0.70,1.0);
  if(id<3.5) return vec3(0.95,0.95,0.99);
  if(id<4.5) return vec3(0.30,0.66,0.88);
  if(id<5.5) return vec3(0.93,0.52,0.73);
  if(id<6.5) return vec3(1.0,0.68,0.56);
  if(id<7.5) return vec3(0.12,0.24,0.42);
  if(id<8.5) return vec3(0.96,0.72,0.38);
  if(id<9.5) return vec3(0.82,0.86,1.0);
  if(id<10.5) return vec3(0.92,0.73,0.6);
  if(id<11.5) return vec3(0.16,0.17,0.28);
  if(id<12.5) return vec3(0.56,0.37,0.26);
  if(id<13.5) return vec3(0.98,0.81,0.71);
  return vec3(0.36,0.24,0.17);
}
vec3 nrm(vec3 p){vec2 e=vec2(0.0012,0.);return normalize(vec3(scene(p+e.xyy).x-scene(p-e.xyy).x,scene(p+e.yxy).x-scene(p-e.yxy).x,scene(p+e.yyx).x-scene(p-e.yyx).x));}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<6;i++){float h=0.02+0.07*float(i);o+=(h-scene(p+n*h).x)*s;s*=0.75;}return clamp(1.-1.6*o,0.,1.);}
float shadow(vec3 ro,vec3 rd){float res=1.,t=0.03;for(int i=0;i<40;i++){float h=scene(ro+rd*t).x;res=min(res,10.*h/t);t+=clamp(h,0.02,0.2);if(res<0.002||t>4.)break;}return clamp(res,0.,1.);}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
  vec3 ro=vec3(2.7,2.35,3.5)*1.08, ta=vec3(0.,-0.08,0.);
  if(uIcon==15){ ro=vec3(1.4,0.5,5.4); ta=vec3(0.,-0.25,0.); }
  if(uIcon==8||uIcon==9||uIcon==13){ ro=vec3(1.5,0.75,5.3); ta=vec3(0.,-0.05,0.); }
  if(uIcon==16){ ro=vec3(0.5,1.1,8.6); ta=vec3(0.,-0.45,0.); }
  vec3 ww=normalize(ta-ro), uu=normalize(cross(ww,vec3(0,1,0))), vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+2.05*ww);
  float t=0.; vec2 h; bool hit=false;
  for(int i=0;i<160;i++){ h=scene(ro+rd*t); if(h.x<0.0007){hit=true;break;} t+=h.x; if(t>12.)break; }
  vec3 L1=normalize(vec3(-0.55,1.0,0.55)), L2=normalize(vec3(0.9,0.25,0.2));
  if(hit){
    vec3 p=ro+rd*t, n=nrm(p), col=matCol(h.y);
    float dif=clamp(dot(n,L1),0.,1.); float wrap=clamp(dot(n,L1)*0.5+0.5,0.,1.);
    float sh=shadow(p+n*0.003,L1); float o=ao(p,n);
    float fil=clamp(dot(n,L2),0.,1.);
    float fre=pow(1.-clamp(dot(n,-rd),0.,1.),3.);
    float spec=pow(clamp(dot(n,normalize(L1-rd)),0.,1.),90.)*sh;
    vec3 c=col*(0.30+0.42*wrap+0.38*dif*sh)*mix(0.6,1.,o);
    c+=col*vec3(0.85,0.82,1.)*fil*0.18;
    c+=col*0.10*clamp(-n.y,0.,1.);
    bool gl=h.y>8.5&&h.y<9.5;
    c+=vec3(1.)*spec*(gl?0.9:0.38);
    c+=mix(col,vec3(1.),0.55)*fre*(gl?0.6:0.22);
